<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1e24">
<title>DeepSeek V3 RP</title>
<style>
  :root {
    --bg: #131316;
    --card: #1e1e24;
    --sidebar: #18181d;
    --user-msg: #2b354f;
    --bot-msg: #1e1e24;
    --accent: #4d6bfe;
    --text: #ececf1;
    --muted: #8e8ea0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { background: var(--card); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d35; z-index: 2; }
  .left-head { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; flex-shrink: 0; }
  .btns { display: flex; gap: 6px; }
  button { background: #2a2a32; color: var(--text); border: none; padding: 7px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:active { opacity: 0.7; }
  
  /* Боковое меню чатов */
  #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 15; }
  #sidebar { position: fixed; top: 0; bottom: 0; left: -270px; width: 260px; background: var(--sidebar); border-right: 1px solid #2d2d35; z-index: 20; transition: left 0.2s ease; display: flex; flex-direction: column; padding: 14px; }
  #sidebar.open { left: 0; }
  .new-chat-btn { background: var(--accent); color: white; font-weight: 600; padding: 10px; border-radius: 10px; width: 100%; margin-bottom: 14px; text-align: center; }
  #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item { padding: 10px 12px; border-radius: 8px; background: #222228; display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: pointer; }
  .chat-item.active { background: #2b354f; border: 1px solid var(--accent); }
  .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding-right: 8px; }
  .del-chat { color: var(--muted); font-size: 14px; padding: 2px 6px; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--bot-msg); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d2d35; }
  .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 8px; display: block; }
  .msg-actions { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .msg-actions span { cursor: pointer; }
  #preview-bar { display: none; background: var(--card); padding: 8px 14px; border-top: 1px solid #2d2d35; align-items: center; gap: 10px; }
  #preview-bar img { height: 48px; border-radius: 6px; }
  #preview-bar span { font-size: 13px; color: var(--muted); flex: 1; }
  footer { background: var(--card); padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #2d2d35; align-items: flex-end; }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid #2d2d35; border-radius: 12px; padding: 10px 12px; font-size: 15px; resize: none; max-height: 120px; outline: none; }
  #attach { background: #2a2a32; color: var(--text); font-size: 18px; padding: 9px 12px; border-radius: 12px; }
  #send { background: var(--accent); color: white; font-weight: 600; padding: 10px 16px; border-radius: 12px; }
  #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 20px; align-items: center; justify-content: center; z-index: 30; }
  .modal-box { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .modal-box input, .modal-box textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid #2d2d35; padding: 10px; border-radius: 8px; font-size: 14px; }
  label { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
  <button class="new-chat-btn" onclick="createNewChat()">+ Новая ролка</button>
  <div id="chat-list"></div>
</div>

<header>
  <div class="left-head">
    <button onclick="toggleSidebar(true)">☰</button>
    <h1><span class="dot"></span> <span id="header-title">DeepSeek V3</span></h1>
  </div>
  <div class="btns">
    <button id="btn-export" title="Скачать текст">💾</button>
    <button id="btn-settings" title="Настройки">⚙️</button>
  </div>
</header>

<div id="chat"></div>

<div id="preview-bar">
  <img id="preview-img" src="">
  <span>Фото прикреплено</span>
  <button id="btn-clear-img">✕</button>
</div>

<footer>
  <input type="file" id="file-input" accept="image/*" style="display:none">
  <button id="attach">📎</button>
  <textarea id="input" rows="1" placeholder="Напиши ход или прикрепи фото..."></textarea>
  <button id="send">➤</button>
</footer>

<div id="settings-modal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Настройки</h3>
      <button id="btn-close-settings" style="padding:4px 8px;">✕</button>
    </div>
    <label>Твой токен GitHub (ghp_...):</label>
    <input type="password" id="api-key" placeholder="Вставь токен сюда">
    <label>Характер и правила ролки:</label>
    <textarea id="sys-prompt" rows="4"></textarea>
    <button id="btn-save-settings" style="background: var(--accent); padding: 10px; font-weight: 600;">Сохранить</button>
  </div>
</div>

<script>
  const DEFAULT_PROMPT = "Ты — талантливый соигрок в текстовой ролевой игре. Пиши на русском языке динамично, эмоционально и живо, строго на 4–6 абзацев, по 3–4 предложения в каждом. Избегай лишней воды и затянутых описаний природы, делай упор на атмосферу, реакции, действия и живые диалоги. Никогда не описывай действия, слова и мысли персонажа игрока. Всегда оставляй героям надежду и тяни сюжет к счастливому финалу (хэппи-энду), даже в самых мрачных ситуациях.";

  let chats = JSON.parse(localStorage.getItem('rp_chats') || '[]');
  let activeChatId = localStorage.getItem('rp_active_id') || '';
  let apiKey = localStorage.getItem('rp_gh_key') || '';
  let sysPrompt = localStorage.getItem('rp_prompt') || DEFAULT_PROMPT;
  let currentImageBase64 = null;

  if (!chats.length) {
    const id = Date.now().toString();
    chats = [{ id: id, title: 'Ролка #1', messages: [] }];
    activeChatId = id;
    saveAll();
  }

  function getActiveChat() {
    let c = chats.find(x => x.id === activeChatId);
    if (!c) { c = chats[0]; activeChatId = c.id; }
    return c;
  }

  function saveAll() {
    localStorage.setItem('rp_chats', JSON.stringify(chats));
    localStorage.setItem('rp_active_id', activeChatId);
  }

  function toggleSidebar(show) {
    document.getElementById('sidebar').className = show ? 'open' : '';
    document.getElementById('sidebar-overlay').style.display = show ? 'block' : 'none';
    if (show) renderChatList();
  }

  function renderChatList() {
    const listEl = document.getElementById('chat-list');
    listEl.innerHTML = '';
    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
      const title = document.createElement('div');
      title.className = 'chat-title';
      title.textContent = c.title;
      title.onclick = () => { activeChatId = c.id; saveAll(); render(); toggleSidebar(false); };
      
      const del = document.createElement('span');
      del.className = 'del-chat';
      del.textContent = '🗑️';
      del.onclick = (e) => {
        e.stopPropagation();
        if (confirm('Удалить этот чат?')) {
          chats = chats.filter(x => x.id !== c.id);
          if (!chats.length) {
            const id = Date.now().toString();
            chats = [{ id: id, title: 'Ролка #1', messages: [] }];
          }
          activeChatId = chats[0].id;
          saveAll();
          renderChatList();
          render();
        }
      };
      item.appendChild(title);
      item.appendChild(del);
      listEl.appendChild(item);
    });
  }

  function createNewChat() {
    const id = Date.now().toString();
    chats.unshift({ id: id, title: 'Новая ролка', messages: [] });
    activeChatId = id;
    saveAll();
    render();
    toggleSidebar(false);
  }

  function render() {
    const chat = getActiveChat();
    document.getElementById('header-title').textContent = chat.title;
    const chatEl = document.getElementById('chat');
    chatEl.innerHTML = '';
    chat.messages.forEach((m, idx) => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
      if (m.img) {
        const im = document.createElement('img');
        im.src = m.img;
        div.appendChild(im);
      }
      const txt = document.createElement('div');
      txt.textContent = m.displayContent || m.content;
      div.appendChild(txt);

      if (m.role === 'assistant' && idx === chat.messages.length - 1) {
        const act = document.createElement('div');
        act.className = 'msg-actions';
        const regenBtn = document.createElement('span');
