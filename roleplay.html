<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1e24">
<title>DeepSeek V3 RP</title>
<style>
  :root {
    --bg: #131316;
    --card: #1e1e24;
    --user-msg: #2b354f;
    --bot-msg: #1e1e24;
    --accent: #4d6bfe;
    --text: #ececf1;
    --muted: #8e8ea0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--card); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d35; }
  header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
  .btns { display: flex; gap: 8px; }
  button { background: #2a2a32; color: var(--text); border: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  button:active { opacity: 0.7; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--bot-msg); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d2d35; }
  .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 8px; display: block; }
  .msg-actions { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .msg-actions span { cursor: pointer; }
  #preview-bar { display: none; background: var(--card); padding: 8px 14px; border-top: 1px solid #2d2d35; align-items: center; gap: 10px; }
  #preview-bar img { height: 48px; border-radius: 6px; }
  #preview-bar span { font-size: 13px; color: var(--muted); flex: 1; }
  footer { background: var(--card); padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #2d2d35; align-items: flex-end; }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid #2d2d35; border-radius: 12px; padding: 10px 12px; font-size: 15px; resize: none; max-height: 120px; outline: none; }
  #attach { background: #2a2a32; color: var(--text); font-size: 18px; padding: 9px 12px; border-radius: 12px; }
  #send { background: var(--accent); color: white; font-weight: 600; padding: 10px 16px; border-radius: 12px; }
  #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .modal-box input, .modal-box textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid #2d2d35; padding: 10px; border-radius: 8px; font-size: 14px; }
  label { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> DeepSeek V3 RP</h1>
  <div class="btns">
    <button onclick="exportChat()" title="Скачать текст">💾</button>
    <button onclick="clearChat()" title="Новый чат">🗑️</button>
    <button onclick="openSettings()">⚙️</button>
  </div>
</header>

<div id="chat"></div>

<div id="preview-bar">
  <img id="preview-img" src="">
  <span>Фото прикреплено</span>
  <button onclick="clearImage()">✕</button>
</div>

<footer>
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)">
  <button id="attach" onclick="document.getElementById('file-input').click()">📎</button>
  <textarea id="input" rows="1" placeholder="Напиши ход или прикрепи фото..."></textarea>
  <button id="send" onclick="sendMessage()">➤</button>
</footer>

<div id="settings-modal">
  <div class="modal-box">
    <h3>Настройки</h3>
    <label>Твой токен GitHub (ghp_...):</label>
    <input type="password" id="api-key" placeholder="Вставь токен сюда">
    <label>Характер и правила ролки:</label>
    <textarea id="sys-prompt" rows="4"></textarea>
    <button style="background: var(--accent); padding: 10px;" onclick="saveSettings()">Сохранить</button>
  </div>
</div>

<script>
  const DEFAULT_PROMPT = "Ты — талантливый соигрок в текстовой ролевой игре. Пиши на русском языке динамично, эмоционально и живо, строго на 4–6 абзацев, по 3–4 предложения в каждом. Избегай лишней воды и затянутых описаний природы, делай упор на атмосферу, реакции, действия и живые диалоги. Никогда не описывай действия, слова и мысли персонажа игрока. Всегда оставляй героям надежду и тяни сюжет к счастливому финалу (хэппи-энду), даже в самых мрачных ситуациях.";
  
  let history = JSON.parse(localStorage.getItem('rp_history') || '[]');
  let apiKey = localStorage.getItem('rp_gh_key') || '';
  let sysPrompt = localStorage.getItem('rp_prompt') || DEFAULT_PROMPT;
  let currentImageBase64 = null;

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');

  function handleImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxDim = 800;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('preview-img').src = currentImageBase64;
        document.getElementById('preview-bar').style.display = 'flex';
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    currentImageBase64 = null;
    document.getElementById('file-input').value = '';
    document.getElementById('preview-bar').style.display = 'none';
  }

  function render() {
    chatEl.innerHTML = '';
    history.forEach((m, idx) => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
      if (m.img) {
        const im = document.createElement('img');
        im.src = m.img;
        div.appendChild(im);
      }
      const txt = document.createElement('div');
      txt.textContent = m.displayContent || m.content;
      div.appendChild(txt);

      if (m.role === 'assistant' && idx === history.length - 1) {
        const act = document.createElement('div');
        act.className = 'msg-actions';
        act.innerHTML = `<span onclick="regenerate()">🔄 Перегенерировать</span>`;
        div.appendChild(act);
      }
      chatEl.appendChild(div);
    });
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function describeImage(base64Img) {
    const res = await fetch('https://azure.com', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'gpt-4o',
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: 'Подробно опиши на русском языке внешность персонажа, одежду, позу, эмоции и окружение на этом изображении для текстовой ролевой игры. Без вступлений, только факты.' },
            { type: 'image_url', image_url: { url: base64Img } }
          ]
        }]
      })
    });
    const data = await res.json();
    return data.choices[0].message.content;
  }

  async function sendMessage(isRegen = false) {
    if (!apiKey) { openSettings(); return; }
    let imgToSend = currentImageBase64;
    let userText = inputEl.value.trim();

    if (!isRegen) {
      if (!userText && !imgToSend) return;
      inputEl.value = '';
      clearImage();
      history.push({
        role: 'user',
        content: userText || 'Посмотри на это изображение.',
        displayContent: userText || '📷 [Изображение]',
        img: imgToSend
      });
    }
    saveHistory();
    render();

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg bot';
    loadingDiv.textContent = imgToSend ? 'Изучает фото и пишет...' : 'Пишет...';
    chatEl.appendChild(loadingDiv);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      if (!isRegen && imgToSend) {
        const imgDesc = await describeImage(imgToSend);
        const lastMsg = history[history.length - 1];
        lastMsg.content = `[Игрок прикрепил изображение. Описание картинки: ${imgDesc}]\n\n${userText}`;
        saveHistory();
      }

      const apiMessages = [
        { role: 'system', content: sysPrompt },
        ...history.map(m => ({ role: m.role, content: m.content }))
      ];

      const res = await fetch('https://azure.com', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'DeepSeek-V3',
          messages: apiMessages
        })
      });
      const data = await res.json();
      loadingDiv.remove();
      if (data.error) {
        alert('Ошибка: ' + (data.error.message || JSON.stringify(data.error)));
      } else if (data.choices && data.choices[0]) {
